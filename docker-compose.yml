services:
  tien-len:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tien-len-game
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - HOST_IP=${HOST_IP:-192.168.2.217}
      - FLATFILE_DIR=/app/data
    volumes:
      - ./data:/app/data
